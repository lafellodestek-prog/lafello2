# Render "Blueprint" tanimi: depo baglaninca bu ayarlarla ucretsiz bir web servisi kurulur.
# Gizli degerler (sync: false) kurulum sirasinda Render ekraninda doldurulur, depoya yazilmaz.
services:
  - type: web
    name: lafello
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
